name: Local CI/CD Pipeline

on: [push]

jobs:
  # 1. Стадия сборки (Build)
  build:
    name: Build Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: ./gradlew :server:installDist --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: server/build/install/server/

  # 2. Стадия тестирования (Test)
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}

      - name: Run tests
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          PORT: ${{ secrets.PORT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: ./gradlew :server:test --no-daemon

      - name: Upload JUnit Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: server/build/test-results/test/*.xml

  # 3. Стадия безопасности (SAST)
  sast:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep \
            semgrep scan --config auto --severity ERROR --error /src


  # 4. Стадия развертывания (Local Deploy)
  deploy:
    name: Local Docker Deploy
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: server/build/install/server/

      - name: Build and Run Docker Container
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          PORT: ${{ secrets.PORT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          APP_PORT="${PORT:-8081}"
          docker stop filemanager-server || true
          docker rm filemanager-server || true
          docker build --no-cache -t filemanager-server:latest .
          docker run -d --name filemanager-server \
            -e DOMAIN="0.0.0.0" \
            -e PORT="$APP_PORT" \
            -e JWT_SECRET="$JWT_SECRET" \
            -p "$APP_PORT":"$APP_PORT" \
            filemanager-server:latest ./bin/server -port="$APP_PORT"
